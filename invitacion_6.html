<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fffdf8" />
  <title>Invitación 6 - Trabajo temporal</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf8}
    #inv6Work{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdf8}
  </style>
</head>
<body>
  <iframe id="inv6Work" src="https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_6/?satellite=20260823-1741" title="Invitación 6 - entorno temporal" allow="autoplay; fullscreen"></iframe>
  <script>
  (()=>{
    const outer=document.getElementById('inv6Work');
    const BLOCK_ID='sat-inv6-green-location-exact';
    const STYLE_ID='sat-inv6-green-location-exact-style';
    let greenSrcPromise=null;

    function deepestDoc(){
      try{
        const d1=outer.contentDocument||outer.contentWindow.document;
        const f1=d1.getElementById('inviteFrame');
        if(!f1) return null;
        const d2=f1.contentDocument||f1.contentWindow.document;
        const f2=d2.getElementById('inv5');
        if(!f2) return null;
        return f2.contentDocument||f2.contentWindow.document;
      }catch(e){return null;}
    }

    function greenSrc(){
      if(greenSrcPromise) return greenSrcPromise;
      greenSrcPromise=fetch('https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_1/invitacion_1.html?v=green-exact-1',{cache:'no-store'})
        .then(r=>r.text())
        .then(html=>{
          const src=new DOMParser().parseFromString(html,'text/html').querySelector('img.church-green-img')?.getAttribute('src')||'';
          if(!src.startsWith('data:image/')) throw new Error('Fondo verde no encontrado');
          return src;
        });
      return greenSrcPromise;
    }

    function ensureFonts(doc){
      if(doc.getElementById('sat-inv6-exact-fonts')) return;
      const link=doc.createElement('link');
      link.id='sat-inv6-exact-fonts';
      link.rel='stylesheet';
      link.href='https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap';
      doc.head.appendChild(link);
    }

    function ensureStyle(doc){
      let s=doc.getElementById(STYLE_ID);
      if(!s){s=doc.createElement('style');s.id=STYLE_ID;doc.head.appendChild(s);}
      s.textContent=`
        #${BLOCK_ID}{width:100%!important;margin:0!important;padding:0!important;background:transparent!important;position:relative!important;overflow:hidden!important}
        #${BLOCK_ID} .church-green-wrap{width:100%!important;max-width:680px!important;margin:0 auto!important;padding:0!important;position:relative!important;overflow:hidden!important;background:transparent!important}
        #${BLOCK_ID} .green-img{display:block!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important}
        #${BLOCK_ID} .church-overlay-content{position:absolute!important;inset:0!important;z-index:2!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;text-align:center!important;padding:105px 32px 120px!important;box-sizing:border-box!important;color:#FBF8EF!important;pointer-events:none!important;transform:translateY(144px)!important}
        #${BLOCK_ID} .church-kicker{margin:0 0 16px!important;font-family:'Cormorant Garamond',serif!important;font-size:13px!important;line-height:1.2!important;letter-spacing:5px!important;font-weight:400!important;color:#D9D6B9!important;text-transform:uppercase!important;white-space:nowrap!important}
        #${BLOCK_ID} .church-title{margin:0 0 24px!important;font-family:'Great Vibes',cursive!important;font-size:clamp(52px,11vw,72px)!important;line-height:.90!important;font-weight:400!important;color:#FBF8EF!important;width:100%!important;max-width:520px!important}
        #${BLOCK_ID} .church-title span{display:block!important;white-space:nowrap!important}
        #${BLOCK_ID} .church-main-copy{margin:0 0 34px!important;font-family:'Cormorant Garamond',serif!important;font-size:clamp(18px,4.5vw,25px)!important;line-height:1.35!important;font-weight:400!important;color:#FBF8EF!important;max-width:320px!important;width:100%!important}
        #${BLOCK_ID} .church-place-name{margin:0 0 14px!important;font-family:'Great Vibes',cursive!important;font-size:clamp(46px,10vw,64px)!important;line-height:1!important;font-weight:400!important;color:#F2E4AB!important;width:100%!important;white-space:nowrap!important}
        #${BLOCK_ID} .church-address{margin:0 0 34px!important;font-family:'Cormorant Garamond',serif!important;font-size:clamp(18px,4.6vw,24px)!important;line-height:1.4!important;font-weight:400!important;color:#FBF8EF!important;border-bottom:1px solid rgba(217,214,185,.45)!important;padding:0 4px 6px!important;max-width:390px!important;width:auto!important;white-space:nowrap!important}
        #${BLOCK_ID} .church-note{margin:0 0 28px!important;font-family:'Cormorant Garamond',serif!important;font-size:clamp(17px,4.2vw,22px)!important;line-height:1.45!important;font-weight:400!important;color:rgba(251,248,239,.88)!important;max-width:330px!important;width:100%!important}
        @media(max-width:540px){#${BLOCK_ID} .church-overlay-content{padding:82px 20px 95px!important}}
        @media(max-width:390px){#${BLOCK_ID} .church-overlay-content{padding-left:16px!important;padding-right:16px!important}#${BLOCK_ID} .church-title{font-size:clamp(48px,13vw,58px)!important}#${BLOCK_ID} .church-place-name{font-size:clamp(42px,11vw,52px)!important}#${BLOCK_ID} .church-address{font-size:clamp(16px,4.35vw,19px)!important;letter-spacing:-.01em!important}}
      `;
    }

    async function apply(){
      const doc=deepestDoc();
      if(!doc) return false;
      const location=doc.querySelector('section.location-section');
      if(!location) return false;
      ensureFonts(doc);ensureStyle(doc);
      doc.querySelectorAll('#inv6-green-location-from-inv1,#sat-inv6-green-location-exact').forEach(n=>n.remove());
      const block=doc.createElement('section');
      block.id=BLOCK_ID;
      block.setAttribute('aria-label','Ubicación de la ceremonia y recepción');
      block.innerHTML=`<div class="church-green-wrap"><img class="green-img" alt="" aria-hidden="true"><div class="church-overlay-content"><div class="church-kicker">UBICACIÓN</div><div class="church-title"><span>Ceremonia</span><span>&amp; Recepción</span></div><p class="church-main-copy">La boda y la recepción se realizarán en el mismo lugar.</p><div class="church-place-name">Residencia Privada</div><div class="church-address">Calle Acapulco 480, La Molina</div><p class="church-note">Te esperamos para compartir juntos cada momento de este día tan especial.</p></div></div>`;
      location.insertAdjacentElement('afterend',block);
      try{block.querySelector('.green-img').src=await greenSrc();}catch(e){console.error(e)}
      return true;
    }

    outer.addEventListener('load',()=>{
      [200,600,1200,2200,4000].forEach(t=>setTimeout(apply,t));
      let n=0;const timer=setInterval(()=>{apply();if(++n>20)clearInterval(timer)},700);
    });
  })();
  </script>
</body>
</html>
