<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fffdf8" />
  <title>Invitación 6 - Trabajo temporal</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf8}
    #inv6Work{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdf8}
  </style>
</head>
<body>
  <iframe id="inv6Work" src="https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_6/?satellite=2" title="Invitación 6 - entorno temporal" allow="autoplay; fullscreen"></iframe>
  <script>
  (()=>{
    window.INV6_SATELLITE_WORKBENCH=true;
    const outer=document.getElementById('inv6Work');
    const OVERLAY_ID='sat-inv6-location-overlay';
    const STYLE_ID='sat-inv6-location-style';

    function deepestDoc(){
      try{
        const wdoc=outer.contentDocument||outer.contentWindow.document;
        const inviteFrame=wdoc.getElementById('inviteFrame');
        if(!inviteFrame) return null;
        const wrap=inviteFrame.contentDocument||inviteFrame.contentWindow.document;
        const inv5=wrap.getElementById('inv5');
        if(!inv5) return null;
        return inv5.contentDocument||inv5.contentWindow.document;
      }catch(e){ return null; }
    }

    function findGreenCard(doc,location){
      const direct=doc.querySelector('.church-green-wrap, .inv6-green-location-wrap, [class*="green"][class*="location"]');
      if(direct) return direct;
      const greenImg=doc.querySelector('img.church-green-img, img.inv6-green-location-img, img[class*="green"]');
      if(greenImg) return greenImg.parentElement || greenImg;
      if(location){
        let node=location.nextElementSibling;
        for(let i=0;node&&i<5;i++,node=node.nextElementSibling){
          const img=node.matches?.('img')?node:node.querySelector?.('img');
          if(img){
            const r=img.getBoundingClientRect();
            if(r.width>280 && r.height>320) return img.parentElement||node;
          }
        }
      }
      return null;
    }

    function ensureStyle(doc){
      let style=doc.getElementById(STYLE_ID);
      if(!style){style=doc.createElement('style');style.id=STYLE_ID;doc.head.appendChild(style)}
      style.textContent=`
        #${OVERLAY_ID}{position:absolute!important;inset:0!important;z-index:20!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;padding:clamp(118px,18vw,148px) 38px 64px!important;transform:translateY(18px)!important;box-sizing:border-box!important;pointer-events:none!important;color:#f3eadb!important}
        #${OVERLAY_ID} .church-kicker{margin:0 0 20px!important;font-size:clamp(12px,3.1vw,16px)!important;line-height:1.15!important;letter-spacing:.24em!important;font-weight:600!important;color:#f3eadb!important}
        #${OVERLAY_ID} .church-title{margin:0 0 18px!important;display:flex!important;flex-direction:column!important;gap:0!important;color:#f6eee1!important}
        #${OVERLAY_ID} .church-title span{display:block!important;font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(28px,7.2vw,44px)!important;line-height:1.02!important;font-weight:400!important}
        #${OVERLAY_ID} .church-main-copy,#${OVERLAY_ID} .church-note{max-width:430px!important;margin:0 auto!important;font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(14px,3.7vw,18px)!important;line-height:1.42!important;color:#efe5d5!important}
        #${OVERLAY_ID} .church-main-copy{margin-bottom:20px!important}
        #${OVERLAY_ID} .church-place-name{margin:0 0 7px!important;font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(20px,5.2vw,29px)!important;line-height:1.16!important;font-weight:600!important;color:#f7efe3!important}
        #${OVERLAY_ID} .church-address{margin:0 0 20px!important;font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(14px,3.8vw,18px)!important;line-height:1.3!important;color:#eee3d3!important}
        @media(max-width:540px){#${OVERLAY_ID}{padding:116px 34px 58px!important;transform:translateY(16px)!important}#${OVERLAY_ID} .church-kicker{margin-bottom:18px!important}#${OVERLAY_ID} .church-title{margin-bottom:16px!important}#${OVERLAY_ID} .church-main-copy{margin-bottom:18px!important}#${OVERLAY_ID} .church-address{margin-bottom:18px!important}}
      `;
    }

    function apply(){
      const doc=deepestDoc(); if(!doc) return false;
      const location=doc.querySelector('section.location-section');
      const card=findGreenCard(doc,location); if(!card) return false;
      const host=card.matches?.('img')?(card.parentElement||card):card;
      const cs=doc.defaultView.getComputedStyle(host); if(cs.position==='static') host.style.setProperty('position','relative','important');
      ensureStyle(doc);
      let overlay=host.querySelector?.('#'+OVERLAY_ID);
      if(!overlay){
        overlay=doc.createElement('div'); overlay.id=OVERLAY_ID; overlay.className='church-overlay-content';
        overlay.innerHTML=`<div class="church-kicker">UBICACIÓN</div><div class="church-title"><span>Ceremonia</span><span>&amp; Recepción</span></div><p class="church-main-copy">La boda y la recepción se realizarán en el mismo lugar.</p><div class="church-place-name">Residencia Privada</div><div class="church-address">Calle Acapulco 480, La Molina</div><p class="church-note">Te esperamos para compartir juntos cada momento de este día tan especial.</p>`;
        host.appendChild(overlay);
      }
      return true;
    }

    outer.addEventListener('load',()=>{[100,350,800,1500,2600,4200].forEach(t=>setTimeout(apply,t));const timer=setInterval(apply,700);setTimeout(()=>clearInterval(timer),10000)});
  })();
  </script>
</body>
</html>
