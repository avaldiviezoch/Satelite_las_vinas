<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fffdf8" />
  <title>Invitación 6 - Trabajo temporal</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf8}
    #inv6Work{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdf8}
  </style>
</head>
<body>
  <iframe id="inv6Work" src="https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_6/?satellite=5&v=20260823-crewfont2" title="Invitación 6 - entorno temporal" allow="autoplay; fullscreen"></iframe>
  <script>
  (()=>{
    window.INV6_SATELLITE_WORKBENCH=true;
    const outer=document.getElementById('inv6Work');
    const OVERLAY_ID='sat-inv6-location-overlay';
    const STYLE_ID='sat-inv6-location-style';
    const CREW_STYLE_ID='sat-inv6-crew-font-style';

    function deepestDoc(){
      try{
        const wdoc=outer.contentDocument||outer.contentWindow.document;
        const inviteFrame=wdoc.getElementById('inviteFrame');
        if(!inviteFrame) return null;
        const wrap=inviteFrame.contentDocument||inviteFrame.contentWindow.document;
        const inv5=wrap.getElementById('inv5');
        if(!inv5) return null;
        return inv5.contentDocument||inv5.contentWindow.document;
      }catch(e){ return null; }
    }

    function normalizeText(value){
      return (value||'')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ')
        .trim()
        .toLowerCase();
    }

    function applyCrewPhraseFont(doc){
      if(!doc) return false;
      if(!doc.getElementById('sat-inv6-cormorant-font')){
        const link=doc.createElement('link');
        link.id='sat-inv6-cormorant-font';
        link.rel='stylesheet';
        link.href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap';
        doc.head.appendChild(link);
      }

      let style=doc.getElementById(CREW_STYLE_ID);
      if(!style){
        style=doc.createElement('style');
        style.id=CREW_STYLE_ID;
        doc.head.appendChild(style);
      }
      style.textContent=`
        .hands-caption,
        [data-sat-inv6-crew-font="1"]{
          font-family:'Cormorant Garamond',serif !important;
          font-weight:600 !important;
        }
      `;

      const target='toda buena aventura necesita una buena tripulacion';
      let matched=false;
      [...doc.querySelectorAll('p,div,span,h1,h2,h3,h4')].forEach(el=>{
        const text=normalizeText(el.textContent);
        if(text===target || (text.includes('toda buena aventura') && text.includes('buena tripulacion'))){
          el.dataset.satInv6CrewFont='1';
          el.style.setProperty('font-family',"'Cormorant Garamond',serif",'important');
          el.style.setProperty('font-weight','600','important');
          matched=true;
        }
      });
      return matched || !!doc.querySelector('.hands-caption');
    }

    function watchCrewPhrase(doc){
      if(!doc?.body || doc.defaultView.__satInv6CrewObserver) return;
      const Observer=doc.defaultView.MutationObserver;
      if(!Observer) return;
      const observer=new Observer(()=>applyCrewPhraseFont(doc));
      observer.observe(doc.body,{childList:true,subtree:true,characterData:true});
      doc.defaultView.__satInv6CrewObserver=observer;
    }

    function findGreenCard(doc,location){
      const direct=doc.querySelector('.church-green-wrap, .inv6-green-location-wrap, [class*="green"][class*="location"]');
      if(direct) return direct;
      const greenImg=doc.querySelector('img.church-green-img, img.inv6-green-location-img, img[class*="green"]');
      if(greenImg) return greenImg.parentElement || greenImg;
      if(location){
        let node=location.nextElementSibling;
        for(let i=0;node&&i<5;i++,node=node.nextElementSibling){
          const img=node.matches?.('img')?node:node.querySelector?.('img');
          if(img){
            const r=img.getBoundingClientRect();
            if(r.width>280 && r.height>320) return img.parentElement||node;
          }
        }
      }
      return null;
    }

    function ensureStyle(doc){
      let style=doc.getElementById(STYLE_ID);
      if(!style){
        style=doc.createElement('style');
        style.id=STYLE_ID;
        doc.head.appendChild(style);
      }
      style.textContent=`
        #${OVERLAY_ID}{
          position:absolute!important;
          inset:0!important;
          z-index:30!important;
          display:flex!important;
          flex-direction:column!important;
          align-items:center!important;
          justify-content:flex-start!important;
          text-align:center!important;
          padding:82px 22px 72px!important;
          box-sizing:border-box!important;
          pointer-events:none!important;
          color:#f3eadb!important;
        }
        #${OVERLAY_ID} *{box-sizing:border-box!important}
        #${OVERLAY_ID} .church-kicker{
          margin:0 0 16px!important;
          font-family:"Cormorant Garamond",serif!important;
          font-size:13px!important;
          line-height:1.2!important;
          letter-spacing:5px!important;
          font-weight:400!important;
          color:#d9d6b9!important;
          text-transform:uppercase!important;
        }
        #${OVERLAY_ID} .church-title{
          margin:0 0 34px!important;
          display:flex!important;
          flex-direction:column!important;
          gap:0!important;
          color:#fffdf6!important;
          font-family:"Great Vibes",cursive!important;
          font-weight:400!important;
          line-height:.86!important;
          font-size:clamp(54px,12vw,76px)!important;
        }
        #${OVERLAY_ID} .church-title span{display:block!important}
        #${OVERLAY_ID} .church-main-copy{
          margin:0 0 36px!important;
          max-width:330px!important;
          font-family:"Cormorant Garamond",serif!important;
          font-size:clamp(18px,4.8vw,25px)!important;
          line-height:1.35!important;
          font-weight:400!important;
          color:#fffdf6!important;
        }
        #${OVERLAY_ID} .church-place-name{
          margin:0 0 16px!important;
          font-family:"Great Vibes",cursive!important;
          font-size:clamp(48px,10.5vw,66px)!important;
          line-height:1!important;
          font-weight:400!important;
          color:#f2e4ab!important;
        }
        #${OVERLAY_ID} .church-address{
          margin:0 0 36px!important;
          padding-bottom:8px!important;
          width:min(86%,420px)!important;
          border-bottom:1px solid rgba(217,214,185,.5)!important;
          font-family:"Cormorant Garamond",serif!important;
          font-size:clamp(18px,4.6vw,24px)!important;
          line-height:1.35!important;
          font-weight:400!important;
          color:#fffdf6!important;
        }
        #${OVERLAY_ID} .church-note{
          margin:0 0 30px!important;
          max-width:340px!important;
          font-family:"Cormorant Garamond",serif!important;
          font-size:clamp(17px,4.3vw,22px)!important;
          line-height:1.45!important;
          font-weight:400!important;
          color:rgba(255,253,246,.9)!important;
        }
        #${OVERLAY_ID} .church-map-button{
          pointer-events:auto!important;
          display:inline-flex!important;
          align-items:center!important;
          justify-content:center!important;
          min-width:236px!important;
          padding:14px 30px!important;
          border-radius:999px!important;
          background:#fffdf6!important;
          color:#3f482e!important;
          text-decoration:none!important;
          font-family:"Montserrat",sans-serif!important;
          font-size:11px!important;
          line-height:1!important;
          letter-spacing:3px!important;
          font-weight:500!important;
        }
      `;
    }

    function apply(){
      const doc=deepestDoc();
      if(!doc) return false;
      applyCrewPhraseFont(doc);
      watchCrewPhrase(doc);
      const location=doc.querySelector('section.location-section');
      const card=findGreenCard(doc,location);
      if(!card) return true;
      const host=card.matches?.('img')?(card.parentElement||card):card;
      const cs=doc.defaultView.getComputedStyle(host);
      if(cs.position==='static') host.style.setProperty('position','relative','important');
      ensureStyle(doc);
      let overlay=host.querySelector?.('#'+OVERLAY_ID);
      if(!overlay){
        overlay=doc.createElement('div');
        overlay.id=OVERLAY_ID;
        overlay.className='church-overlay-content';
        overlay.innerHTML=`
          <div class="church-kicker">UBICACIÓN</div>
          <div class="church-title"><span>Ceremonia</span><span>&amp; Recepción</span></div>
          <p class="church-main-copy">La boda y la recepción se realizarán en el mismo lugar.</p>
          <div class="church-place-name">Residencia Privada</div>
          <div class="church-address">Calle Acapulco 480, La Molina</div>
          <p class="church-note">Te esperamos para compartir juntos cada momento de este día tan especial.</p>
          <a class="church-map-button" href="https://www.google.com/maps/search/?api=1&query=Casa+Acapulco+Calle+Acapulco+480+La+Molina+Lima" target="_blank" rel="noopener noreferrer">VER UBICACIÓN</a>`;
        host.appendChild(overlay);
      }
      return true;
    }

    outer.addEventListener('load',()=>{
      [100,350,800,1500,2600,4200,7000,10000].forEach(t=>setTimeout(apply,t));
      const timer=setInterval(apply,600);
      setTimeout(()=>clearInterval(timer),20000);
    });
  })();
  </script>
</body>
</html>
