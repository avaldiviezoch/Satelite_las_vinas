name: Restaurar logo original

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restaurar-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Recuperar PNG original desde el historial
        run: |
          curl -L --fail "https://raw.githubusercontent.com/avaldiviezoch/Wedding/c89bf97af68eb150f1fbac72059fb98ba37ef02a/logo_satelite.png" -o logo_satelite.png
          file logo_satelite.png
      - name: Guardar logo en el repositorio nuevo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo_satelite.png
          if git diff --cached --quiet; then
            echo "El logo ya está actualizado"
          else
            git commit -m "Restaurar logo_satelite.png original"
            git push
          fi
