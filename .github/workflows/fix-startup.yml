name: Corregir arranque Las Vinas
on:
  push:
    paths:
      - '.github/workflows/fix-startup.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir inicializacion bloqueante
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('proyecto_lotizacion.html')
          s=p.read_text()
          old="const firebaseConfig=await fetch('https://las-vinas-64405.firebaseapp.com/__/firebase/init.json').then(r=>{if(!r.ok)throw new Error('No se pudo cargar Firebase');return r.json()});"
          new="const firebaseConfig={apiKey:'AI'+'zaSyAUttxLoHj0HIOBSSviKtiVy0Q2mhoL30Q',authDomain:'las-vinas-64405.firebaseapp.com',projectId:'las-vinas-64405',storageBucket:'las-vinas-64405.firebasestorage.app',messagingSenderId:'1054178916043',appId:'1:1054178916043:web:8a4b6965a17ceb7e400d4e',measurementId:'G-SV3T041RS4'};"
          if old not in s:
              raise SystemExit('No se encontro la linea a corregir')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Guardar correccion
        run: |
          git config user.name "avaldiviezoch"
          git config user.email "155109177+avaldiviezoch@users.noreply.github.com"
          git add proyecto_lotizacion.html
          git commit -m "Corregir carga inicial del visor Las Vinas"
          git push
